name: Platform foundation checks

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-foundation.yml"
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/platform-foundation.yml"

permissions:
  contents: read

jobs:
  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
