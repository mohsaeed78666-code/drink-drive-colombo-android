name: Android CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and lint Android app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Run Android lint and build debug APK
        run: gradle --no-daemon clean lintDebug assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Drink-Drive-Colombo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-diagnostics
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
